name: Weekly FightScore

# Recomputes FightScore (docs/superpowers/specs/2026-09-14-fighter-rating-algorithm-design.md)
# once a week instead of daily, so the ranking stays stable between events and
# moves week to week. Monday 12:00 UTC: UFC cards end around 05:00 UTC Sunday,
# and the Sunday + Monday 09:00 runs of daily-sync.yml have pulled the results
# and current champions into Neon by then. The UFCStats fight-level stats it
# reads are frozen: their scraper was removed on 2026-10-28 (UFCStats blocks
# bots, and fetching it meant bypassing that), so fights after that date carry
# no stats and don't enter FightScore until a licensed source replaces it.
# The recomputation is a full, deterministic replay of every fight. Run it by
# hand (workflow_dispatch) after a data fix that shouldn't wait for Monday.
on:
  schedule:
    - cron: '0 12 * * 1' # Monday 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

# Same group as daily-sync.yml: never recompute while a sync is still writing to Neon.
concurrency:
  group: mma-universe-sync
  cancel-in-progress: false

jobs:
  ratings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # Re-pushes the committed (frozen) UFCStats JSON and re-matches it to fighters,
      # so fighters added to Neon since still get linked to their past UFC stats.
      - name: Sync UFC fight-level stats to Neon
        run: npx tsx data/scrapers/sync-fighter-stats.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Compute FightScore ratings
        run: npx tsx data/scripts/compute-fighter-ratings.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
