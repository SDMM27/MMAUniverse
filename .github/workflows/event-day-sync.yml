name: Event-day live sync

# Tighter polling for the days an event is actually happening. Runs every 30 minutes, Friday to
# Sunday only (almost every card falls on those days; a Saturday card running past 00:00 UTC is
# covered by Sunday's runs) -- kept that sparse to stay inside the free GitHub Actions minutes
# of a private repo. Beyond that,
# check-live-orgs.ts gates everything: if no org has an event dated today (or, until noon UTC,
# yesterday -- an American card runs past 00:00 UTC, see shared/live-dates.ts) it exits immediately
# (a single cheap DB query, no Sherdog traffic at all). On a live day it only rescrapes the
# org(s) fighting tonight — not the whole roster — keeping Sherdog traffic minimal even
# during a live card. See data/scrapers/check-live-orgs.ts for the gate logic.
#
# Also refreshes the Sherdog "Fight History" page of just the fighters on tonight's card (see
# sync-live-fighter-history.ts) so a fighter's own Historique picks up their result right away,
# instead of waiting on a manual backfill:fighter-history run.
on:
  schedule:
    - cron: '*/30 * * * 5,6,0'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mma-universe-sync
  cancel-in-progress: false

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Check which orgs have an event today
        id: live
        run: |
          ORGS=$(npx tsx data/scrapers/check-live-orgs.ts)
          echo "orgs=$ORGS" >> "$GITHUB_OUTPUT"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Rescrape today's org(s)
        if: steps.live.outputs.orgs != ''
        run: |
          for org in ${{ steps.live.outputs.orgs }}; do
            npx tsx data/scrapers/rescrape-upcoming.ts "$org"
          done

      - name: Refresh tonight's fighters' Sherdog history
        if: steps.live.outputs.orgs != ''
        run: npx tsx data/scrapers/sync-live-fighter-history.ts ${{ steps.live.outputs.orgs }}

      - name: Commit refreshed scraped data
        if: steps.live.outputs.orgs != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scraped/*.json
          git diff --cached --quiet || git commit -m "chore(scrape): live event-day refresh"
          git push

      - name: Sync to Neon
        if: steps.live.outputs.orgs != ''
        run: npx tsx data/scrapers/sync-upcoming-to-db.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sync tonight's fighter Sherdog history to Neon
        if: steps.live.outputs.orgs != ''
        run: npx tsx data/scrapers/sync-fighter-history.ts ${{ steps.live.outputs.orgs }} --live
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
