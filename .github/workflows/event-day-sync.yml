name: Event-day live sync

# Tighter polling for the days an event is actually happening. Runs every 15 minutes, but
# check-live-orgs.ts gates everything: if no org has an event dated today it exits immediately
# (a single cheap DB query, no Sherdog traffic at all). On a live day it only rescrapes the
# org(s) fighting tonight — not the whole roster — keeping Sherdog traffic minimal even
# during a live card. See data/scrapers/check-live-orgs.ts for the gate logic.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mma-universe-sync
  cancel-in-progress: false

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Check which orgs have an event today
        id: live
        run: |
          ORGS=$(npx tsx data/scrapers/check-live-orgs.ts)
          echo "orgs=$ORGS" >> "$GITHUB_OUTPUT"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Rescrape today's org(s)
        if: steps.live.outputs.orgs != ''
        run: |
          for org in ${{ steps.live.outputs.orgs }}; do
            npx tsx data/scrapers/rescrape-upcoming.ts "$org"
          done

      - name: Commit refreshed scraped data
        if: steps.live.outputs.orgs != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scraped/*.json
          git diff --cached --quiet || git commit -m "chore(scrape): live event-day refresh"
          git push

      - name: Sync to Neon
        if: steps.live.outputs.orgs != ''
        run: npx tsx data/scrapers/sync-upcoming-to-db.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
