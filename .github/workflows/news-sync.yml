name: News sync

# Polls the RSS/Atom sources in data/news/sources.config.ts and ingests new
# articles into news_articles, every 2 hours (kept sparse to stay inside the
# free GitHub Actions minutes of a private repo). Runs via GitHub Actions
# rather than Vercel Cron for the same reason the other scheduled jobs in
# this repo do (see daily-sync.yml / event-day-sync.yml): Vercel Cron's
# frequency is limited on non-Pro plans, GitHub Actions isn't.
#
# Same caveats already accepted for those other scheduled jobs apply here
# too: GitHub may delay a scheduled run under load, and GitHub auto-disables
# a repo's scheduled workflows after 60 days with no commits (workflow_dispatch
# above lets anyone re-enable/re-run it manually from the Actions tab).
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: {}

concurrency:
  group: mma-universe-news-sync
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Ingest RSS news sources
        run: npx tsx data/news/run-ingest.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
