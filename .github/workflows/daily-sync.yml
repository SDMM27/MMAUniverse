name: Daily data sync

# Baseline refresh: rescrapes every org's upcoming events from Sherdog once a day and syncs
# them into Neon. See data/scrapers/rescrape-upcoming.ts and sync-upcoming-to-db.ts for what
# "targeted" means here — this only touches not-yet-happened events, not the full history.
on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mma-universe-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - name: Rescrape upcoming events (all orgs)
        run: npx tsx data/scrapers/rescrape-upcoming.ts

      # Self-healing counterpart to the event-day polling: re-fetches the Sherdog page of any
      # fighter whose history is still missing a finished fight from the last 30 days (e.g. the
      # live polling missed the end of the card). No-op -- zero Sherdog requests -- on a normal day.
      - name: Catch up fighters' Sherdog history on recent fights
        run: npx tsx data/scrapers/sync-live-fighter-history.ts --catch-up

      - name: Commit refreshed scraped data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scraped/*.json
          git diff --cached --quiet || git commit -m "chore(scrape): daily data refresh"
          git push

      - name: Sync to Neon
        run: npx tsx data/scrapers/sync-upcoming-to-db.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sync UFC broadcast times (prelims + main card) from ufc.com
        run: npx tsx data/scrapers/sync-ufc-broadcast-times.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sync UFC rankings from ufc.com
        run: npx tsx data/scrapers/sync-ufc-rankings.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sync fighter Sherdog history to Neon
        run: npx tsx data/scrapers/sync-fighter-history.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Spreads known genders along the histories just synced, so a women's bout Sherdog labels
      # "Flyweight" shows as "Women's Flyweight". A few queries, recomputed from scratch.
      - name: Infer fighter gender
        run: npx tsx data/scrapers/sync-fighter-gender.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # After the history sync, so fighters that just got a sherdog_url are covered. Sherdog
      # only (no new reach values since the UFCStats source was removed on 2026-10-28). Each
      # page is only ever fetched once (physique_*_checked_at), so on a normal day this is a
      # few requests for newly added fighters. Capped per run: the 2026-10-28 history load
      # (load-org-history.ts) added ~5,000 fighters with a Sherdog URL, drained ~400 a day
      # rather than ~3 hours of Sherdog requests in one go.
      - name: Sync fighter height, reach and birth date
        run: npx tsx data/scrapers/sync-fighter-physique.ts --limit=400
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Free-licensed photos (Wikimedia Commons, via each fighter's Sherdog ID on Wikidata) and
      # their credits. After the history sync for the same reason as above. Two API calls'
      # worth of work; aborts without touching the table if Wikidata answers short.
      - name: Sync free fighter photos from Wikimedia Commons
        run: npx tsx data/scrapers/sync-fighter-photos.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # FightScore is no longer recomputed here: it runs
      # once a week, on Monday, from .github/workflows/weekly-fightscore.yml.
