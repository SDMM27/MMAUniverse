name: Daily data sync

# Baseline refresh: rescrapes every org's upcoming events from Sherdog once a day and syncs
# them into Neon. See data/scrapers/rescrape-upcoming.ts and sync-upcoming-to-db.ts for what
# "targeted" means here — this only touches not-yet-happened events, not the full history.
on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mma-universe-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # UFCStats.com sits behind a JS anti-bot challenge that a plain HTTP
      # client never gets past -- see data/scrapers/shared/fetch-playwright.ts's
      # doc comment. Only the UFCStats scrape below needs this; every other
      # scraper in this workflow is axios+cheerio and doesn't.
      - name: Install Playwright Chromium (for the UFCStats scraper)
        run: npx playwright install --with-deps chromium

      - name: Rescrape upcoming events (all orgs)
        run: npx tsx data/scrapers/rescrape-upcoming.ts

      # Incremental by design (data/scrapers/shared/ufcstats-checkpoint.ts) --
      # only fetches events not already in data/scraped/.cache/ufcstats-progress.json,
      # so a normal day (0-2 new UFC events) is a handful of requests, not the
      # multi-hour full-history crawl a from-scratch run would be.
      - name: Scrape UFC fight-level stats from UFCStats.com
        run: npx tsx data/scrapers/scrape-ufcstats.ts

      # Self-healing counterpart to the event-day polling: re-fetches the Sherdog page of any
      # fighter whose history is still missing a finished fight from the last 30 days (e.g. the
      # live polling missed the end of the card). No-op -- zero Sherdog requests -- on a normal day.
      - name: Catch up fighters' Sherdog history on recent fights
        run: npx tsx data/scrapers/sync-live-fighter-history.ts --catch-up

      - name: Commit refreshed scraped data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scraped/*.json
          git diff --cached --quiet || git commit -m "chore(scrape): daily data refresh"
          git push

      - name: Sync to Neon
        run: npx tsx data/scrapers/sync-upcoming-to-db.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sync UFC broadcast times (prelims + main card) from ufc.com
        run: npx tsx data/scrapers/sync-ufc-broadcast-times.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sync UFC rankings from ufc.com
        run: npx tsx data/scrapers/sync-ufc-rankings.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sync fighter Sherdog history to Neon
        run: npx tsx data/scrapers/sync-fighter-history.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sync UFC fight-level stats to Neon
        run: npx tsx data/scrapers/sync-fighter-stats.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # After the two steps above, so fighters that just got a sherdog_url / ufcstats_url are
      # covered. Each page is only ever fetched once (physique_*_checked_at), so on a normal day
      # this is a few requests for newly added fighters.
      - name: Sync fighter height, reach and birth date
        run: npx tsx data/scrapers/sync-fighter-physique.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # FightScore is no longer recomputed here: it runs once a week, on Monday,
      # from .github/workflows/weekly-fightscore.yml (after the weekend's events).
